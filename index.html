<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Larder</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF0E3; --paper:#FBFAF4; --ink:#20281E; --sub:#5B6152; --line:#D6D3BE;
  --ok:#3E7A52; --warn:#C6871F; --danger:#B23B3B; --star:#A8631E; --star-bg:#F3E4CC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171A14; --paper:#20241B; --ink:#EAE8DC; --sub:#9CA292;
    --line:#3A3E30; --star-bg:#3A2E17;
  }
}
:root[data-theme="dark"]{
  --bg:#171A14; --paper:#20241B; --ink:#EAE8DC; --sub:#9CA292;
  --line:#3A3E30; --star-bg:#3A2E17;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;}
.wrap{max-width:640px;margin:0 auto;padding:24px 18px 60px;}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
header h1{font-size:26px;}
header .sub{color:var(--sub);font-size:13px;}
nav{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:20px;}
nav button{flex:1;padding:9px 6px;border:none;background:transparent;border-radius:7px;font:500 14px Inter;color:var(--sub);cursor:pointer;}
nav button.active{background:var(--ink);color:var(--paper);}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
input,select,textarea{font:400 14px Inter;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);}
textarea{width:100%;min-height:70px;resize:vertical;font-family:Inter;}
input[type=text],input[type=number],input[type=date]{flex:1;min-width:90px;}
button.btn{font:600 13px Inter;padding:9px 14px;border:none;border-radius:7px;background:var(--ink);color:var(--paper);cursor:pointer;}
button.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);}
button.icon{background:none;border:none;color:var(--sub);cursor:pointer;font-size:15px;padding:2px 6px;}
button.icon:hover{color:var(--danger);}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dotted var(--line);}
.item:last-child{border-bottom:none;}
.item .name{font-weight:500;flex:1;min-width:0;}
.item .meta{color:var(--sub);font-size:12px;white-space:nowrap;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot.ok{background:var(--ok);} .dot.warn{background:var(--warn);} .dot.bad{background:var(--danger);}
.star-tag{background:var(--star-bg);color:var(--star);font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;}
.empty{color:var(--sub);font-size:14px;padding:20px 0;text-align:center;}
.pill-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;display:flex;align-items:center;gap:5px;}
.pill button{border:none;background:none;color:var(--sub);cursor:pointer;font-size:12px;line-height:1;}
.idea{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
.idea h3{font-size:16px;margin-bottom:4px;}
.idea .badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
.badge.match{background:#DCE9DE;color:var(--ok);}
.badge.expiring{background:#F6D9D9;color:var(--danger);}
:root[data-theme="dark"] .badge.match, @media (prefers-color-scheme:dark){.badge.match{background:#25352A;}}
.idea ul{margin:6px 0 0;padding-left:18px;font-size:14px;}
.idea li.have{color:var(--ink);} .idea li.missing{color:var(--sub);}
.idea li .starred{color:var(--star);font-weight:600;}
label.small{font-size:12px;color:var(--sub);display:block;margin-bottom:3px;}
.servings-box{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.servings-box input{width:60px;}
footer.hint{color:var(--sub);font-size:12px;text-align:center;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Larder</h1>
      <div class="sub">what you've got, what to make</div>
    </div>
  </header>
  <nav id="tabs"></nav>
  <div id="content"></div>
  <footer class="hint">Saved privately in this browser only.</footer>
</div>
<script>
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let fridge = load('lt_fridge', []);
let ideas = load('lt_ideas', []);
let stars = load('lt_stars', ['chicken','eggplant','eggs','fresh mozzarella']);
let servingsForMe = load('lt_servings', 1);
let tab = 'fridge';

function isStar(name){
  const n = name.toLowerCase();
  return stars.some(s => n.includes(s) || s.includes(n));
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function expiryStatus(days){
  if(days===null) return 'ok';
  if(days<=1) return 'bad';
  if(days<=4) return 'warn';
  return 'ok';
}
function expiryLabel(days){
  if(days===null) return 'no date';
  if(days<0) return `expired ${-days}d ago`;
  if(days===0) return 'expires today';
  if(days===1) return '1 day left';
  return `${days} days left`;
}
function parseIngredientLine(line){
  line = line.trim(); if(!line) return null;
  const units = ['g','kg','ml','l','tsp','tbsp','cup','cups','oz','lb','lbs','pinch','clove','cloves','can','cans','slice','slices'];
  const m = line.match(/^([\d.\/]+)\s*([a-zA-Z]*)\s*(.*)$/);
  if(m && m[1]){
    let unit = m[2].toLowerCase();
    let name = m[3];
    if(!units.includes(unit)){ name = (m[2]+' '+m[3]).trim(); unit=''; }
    let qty = m[1].includes('/') ? (()=>{const [a,b]=m[1].split('/'); return a/b;})() : parseFloat(m[1]);
    return { qty: qty||1, unit, name: name.trim() || line };
  }
  return { qty:1, unit:'', name: line };
}
function fmtQty(n){
  if(!isFinite(n)) return '';
  const r = Math.round(n*100)/100;
  return r.toString();
}

function switchTab(t){ tab=t; render(); }

function render(){
  $('#tabs').innerHTML = ['fridge','ideas','tonight'].map(t =>
    `<button class="${t===tab?'active':''}" onclick="switchTab('${t}')">${t==='fridge'?'Fridge':t==='ideas'?'Ideas':'Tonight'}</button>`
  ).join('');
  if(tab==='fridge') renderFridge();
  else if(tab==='ideas') renderIdeas();
  else renderTonight();
}

function renderFridge(){
  const sorted = [...fridge].sort((a,b)=>{
    const da = daysUntil(a.expiry), db = daysUntil(b.expiry);
    if(da===null) return 1; if(db===null) return -1; return da-db;
  });
  $('#content').innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:10px;">Add to fridge</h3>
      <div class="row">
        <input type="text" id="f-name" placeholder="Ingredient name">
        <input type="text" id="f-qty" placeholder="Qty" style="max-width:70px;">
        <input type="text" id="f-unit" placeholder="Unit" style="max-width:80px;">
        <input type="date" id="f-expiry">
        <button class="btn" onclick="addFridgeItem()">Add</button>
      </div>
      <label class="small">Star ingredients (always highlighted)</label>
      <div class="pill-list" id="star-pills"></div>
      <div class="row" style="margin-top:8px;">
        <input type="text" id="star-input" placeholder="Add a star ingredient">
        <button class="btn secondary" onclick="addStar()">Add</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:6px;">In the fridge (${fridge.length})</h3>
      ${sorted.length ? sorted.map(itemRow).join('') : '<div class="empty">Nothing logged yet — add what you\\'ve got above.</div>'}
    </div>
  `;
  $('#star-pills').innerHTML = stars.map(s=>`<span class="pill">${s}<button onclick="removeStar('${s.replace(/'/g,"\\'")}')">✕</button></span>`).join('') || '<span class="sub" style="font-size:12px;color:var(--sub);">none set</span>';
}
function itemRow(it){
  const d = daysUntil(it.expiry);
  const status = expiryStatus(d);
  const star = isStar(it.name);
  return `<div class="item">
    <span class="dot ${status}"></span>
    <span class="name">${it.name}${star?' <span class="star-tag">★ star</span>':''}</span>
    <span class="meta">${it.qty||''} ${it.unit||''}</span>
    <span class="meta">${expiryLabel(d)}</span>
    <button class="icon" onclick="removeFridgeItem('${it.id}')">✕</button>
  </div>`;
}
function addFridgeItem(){
  const name = $('#f-name').value.trim();
  if(!name) return;
  fridge.push({ id: uid(), name, qty: $('#f-qty').value.trim(), unit: $('#f-unit').value.trim(), expiry: $('#f-expiry').value });
  save('lt_fridge', fridge);
  renderFridge();
}
function removeFridgeItem(id){ fridge = fridge.filter(i=>i.id!==id); save('lt_fridge', fridge); renderFridge(); }
function addStar(){
  const v = $('#star-input').value.trim().toLowerCase();
  if(v && !stars.includes(v)){ stars.push(v); save('lt_stars', stars); render(); }
}
function removeStar(s){ stars = stars.filter(x=>x!==s); save('lt_stars', stars); render(); }

function renderIdeas(){
  $('#content').innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:10px;">Save a recipe idea</h3>
      <div class="row">
        <input type="text" id="i-title" placeholder="Recipe name" style="flex:2;">
        <input type="number" id="i-servings" placeholder="Serves" min="1" style="max-width:80px;" value="4">
      </div>
      <label class="small">Ingredients — one per line, e.g. "2 chicken breasts" or "1 cup rice"</label>
      <textarea id="i-ingredients" placeholder="2 chicken breasts&#10;1 eggplant&#10;3 tbsp olive oil"></textarea>
      <div class="row" style="margin-top:8px;">
        <button class="btn" onclick="addIdea()">Save idea</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:10px;">Idea database (${ideas.length})</h3>
      ${ideas.length ? ideas.map(i=>`
        <div class="idea">
          <div style="display:flex;justify-content:space-between;align-items:start;">
            <h3>${i.title}</h3>
            <button class="icon" onclick="removeIdea('${i.id}')">✕</button>
          </div>
          <div class="meta" style="color:var(--sub);font-size:12px;">serves ${i.servings}</div>
          <ul>${i.ingredients.map(ing=>`<li>${fmtQty(ing.qty)} ${ing.unit} ${isStar(ing.name)?`<span class="starred">${ing.name}</span>`:ing.name}</li>`).join('')}</ul>
        </div>
      `).join('') : '<div class="empty">No ideas saved yet.</div>'}
    </div>
  `;
}
function addIdea(){
  const title = $('#i-title').value.trim();
  if(!title) return;
  const servings = parseInt($('#i-servings').value)||4;
  const ingredients = $('#i-ingredients').value.split('\n').map(parseIngredientLine).filter(Boolean);
  ideas.push({ id: uid(), title, servings, ingredients });
  save('lt_ideas', ideas);
  renderIdeas();
}
function removeIdea(id){ ideas = ideas.filter(i=>i.id!==id); save('lt_ideas', ideas); renderIdeas(); }

function matchIdea(idea){
  const fridgeNames = fridge.map(f=>({name:f.name.toLowerCase(), days: daysUntil(f.expiry)}));
  let matched = 0, expiringUsed = [];
  const lines = idea.ingredients.map(ing=>{
    const n = ing.name.toLowerCase();
    const hit = fridgeNames.find(f => n.includes(f.name) || f.name.includes(n));
    if(hit){
      matched++;
      if(hit.days!==null && hit.days<=4) expiringUsed.push(hit.name);
    }
    return { ...ing, have: !!hit };
  });
  return { lines, matched, total: idea.ingredients.length, expiringUsed: [...new Set(expiringUsed)] };
}

function renderTonight(){
  const scored = ideas.map(idea=>({ idea, m: matchIdea(idea) }))
    .sort((a,b)=> b.m.expiringUsed.length - a.m.expiringUsed.length || (b.m.matched/b.m.total) - (a.m.matched/a.m.total));
  $('#content').innerHTML = `
    <div class="servings-box">
      <label class="small" style="margin:0;">Cooking for</label>
      <input type="number" id="servings-input" min="1" value="${servingsForMe}">
      <span class="sub" style="color:var(--sub);font-size:13px;">serving(s)</span>
    </div>
    ${scored.length ? scored.map(({idea,m})=>`
      <div class="idea">
        <h3>${idea.title}</h3>
        <div class="badges">
          <span class="badge match">${m.matched}/${m.total} ingredients on hand</span>
          ${m.expiringUsed.length ? `<span class="badge expiring">uses ${m.expiringUsed.join(', ')} — expiring soon</span>` : ''}
        </div>
        <ul>${m.lines.map(l=>{
          const factor = servingsForMe/idea.servings;
          const scaled = fmtQty(l.qty*factor);
          return `<li class="${l.have?'have':'missing'}">${scaled} ${l.unit} ${isStar(l.name)?`<span class="starred">${l.name}</span>`:l.name}${l.have?'':' — need to buy'}</li>`;
        }).join('')}</ul>
      </div>
    `).join('') : '<div class="empty">Save some recipe ideas first — they\\'ll show up here ranked by what you can make right now.</div>'}
  `;
  $('#servings-input').addEventListener('change', e=>{
    servingsForMe = parseFloat(e.target.value)||1;
    save('lt_servings', servingsForMe);
    renderTonight();
  });
}

render();
</script>
</body>
</html>
